version: "3"

tasks:
  backend:run:
    desc: Run backend locally
    dir: backend
    cmds:
      - uv run uvicorn backend.main:app --reload

  backend:test:
    desc: Run backend tests
    dir: backend
    cmds:
      - uv run pytest

  backend:test-cov:
    desc: Run backend tests with coverage report
    dir: backend
    cmds:
      - uv run pytest --cov=backend --cov-report=term-missing

  backend:lint:
    desc: Run backend lint checks
    dir: backend
    cmds:
      - uv run ruff check .

  backend:format:
    desc: Format backend code
    dir: backend
    cmds:
      - uv run ruff format .

  backend:format:check:
    desc: Check backend formatting
    dir: backend
    cmds:
      - uv run ruff format --check .

  backend:typecheck:
    desc: Run backend type checks
    dir: backend
    cmds:
      - uv run mypy src tests

  backend:check:
    desc: Run all backend checks
    cmds:
      - task backend:lint
      - task backend:format:check
      - task backend:typecheck
      - task backend:test

  docker:up:
    desc: Start PostgreSQL for local development
    cmds:
      - docker compose up -d postgres

  docker:test-db:
    desc: Create PostgreSQL test database if it does not exist
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/create-test-db.ps1
        platforms: [windows]
      - cmd: bash scripts/create-test-db.sh
        platforms: [linux, darwin]

  docker:down:
    desc: Stop local Docker environment
    cmds:
      - docker compose down

  docker:logs:
    desc: Show PostgreSQL Docker logs
    cmds:
      - docker compose logs -f postgres

  docker:app:
    desc: Start PostgreSQL and backend container
    cmds:
      - docker compose --profile app up --build

  docker:app:down:
    desc: Stop backend container and PostgreSQL
    cmds:
      - docker compose --profile app down
