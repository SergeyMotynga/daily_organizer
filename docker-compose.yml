name: daily_organizer

services:
  postgres:
    image: postgres:17-alpine
    container_name: daily_organizer_postgres
    environment:
      POSTGRES_DB: daily_organizer
      POSTGRES_USER: daily_organizer
      POSTGRES_PASSWORD: daily_organizer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daily_organizer -d daily_organizer"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    profiles:
      - app
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: daily_organizer_backend:latest
    container_name: daily_organizer_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://daily_organizer:daily_organizer@postgres:5432/daily_organizer
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
